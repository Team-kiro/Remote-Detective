name: "Run tests"

# Quality gates for pull requests to main and pushes to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded in-progress runs for the same ref so rapid pushes don't
# queue behind stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install JavaScript dependencies
        run: npm ci

      # `tsc -b` covers src/ and the Playwright specs through tsconfig.node.json.
      - name: Run type-check
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install JavaScript dependencies
        run: npm ci

      # Installed on the runner instead of using the mcr.microsoft.com/playwright
      # image, whose tag must match the pinned @playwright/test version and lags
      # behind npm releases.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The Playwright config's webServer runs `npm run build` (the TypeScript
      # gate) and serves the production bundle before the suite starts.
      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # Trabajo independiente: el backend es un requisito importante pero no
  # bloqueante, por lo que no comparte instalación ni artefactos con el frontend.
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # `sam build` es lo que produce el artefacto real de la Lambda (esbuild
      # empaqueta src/handler.ts en un solo archivo). Un `npm run build` verde
      # no dice nada sobre si el paquete desplegable se genera: cuando esta
      # comprobación faltaba, un despliegue llegó a producción con solo los
      # .ts dentro y la función arrancaba con Runtime.ImportModuleError.
      - name: Validate SAM template
        run: sam validate --lint
        env:
          AWS_REGION: us-east-1

      - name: Build SAM package
        run: sam build
        env:
          AWS_REGION: us-east-1

      # El handler configurado en la plantilla debe existir en el artefacto.
      - name: Verify Lambda artifact
        run: test -f .aws-sam/build/InterrogateFunction/handler.js
