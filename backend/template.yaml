AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Remote Detective — endpoint de interrogación mediante Amazon Bedrock

Parameters:
  AllowedOrigins:
    Type: String
    Description: Lista de orígenes CORS separados por coma (p. ej. "http://localhost:5173,https://tu-app.amplifyapp.com")
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Identificador del modelo Bedrock a invocar

Globals:
  Function:
    Runtime: nodejs20.x
    # Por debajo del tope de 29 s de API Gateway REST, y por encima del timeout
    # de 10 s de Bedrock: así el 504 que emite el handler llega al cliente en
    # lugar de que el gateway corte antes con su propio error.
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        # AWS_REGION la inyecta el runtime de Lambda y es reservada: declararla
        # aquí hace fallar el despliegue. bedrockClient.ts la lee de process.env.
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  InterrogateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handler.handler
      Description: Recibe una pregunta de interrogatorio, construye el prompt y consulta Bedrock
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
      Events:
        PostInterrogate:
          Type: Api
          Properties:
            Path: /interrogate
            Method: post
        OptionsInterrogate:
          Type: Api
          Properties:
            Path: /interrogate
            Method: options

Outputs:
  InterrogateApi:
    Description: URL del endpoint POST /interrogate
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/interrogate"
