AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Remote Detective — endpoint de interrogación mediante Amazon Bedrock

Parameters:
  AllowedOrigins:
    Type: String
    Description: Lista de orígenes CORS separados por coma (p. ej. "http://localhost:5173,https://tu-app.amplifyapp.com")
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Perfil de inferencia entre regiones de Bedrock. Los Claude actuales no
      admiten throughput bajo demanda por ID de modelo directo, así que debe ser
      un inference profile (prefijo "us."), no un foundation-model a secas.
  BedrockFoundationModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Modelo base que respalda el perfil anterior. Se declara aparte porque el
      permiso IAM debe cubrir el perfil y además el modelo en cada región que el
      perfil abarca.

Globals:
  Function:
    Runtime: nodejs20.x
    # Por debajo del tope de 29 s de API Gateway REST, y por encima del timeout
    # de 10 s de Bedrock: así el 504 que emite el handler llega al cliente en
    # lugar de que el gateway corte antes con su propio error.
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        # AWS_REGION la inyecta el runtime de Lambda y es reservada: declararla
        # aquí hace fallar el despliegue. bedrockClient.ts la lee de process.env.
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  InterrogateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: dist/handler.handler
      Description: Recibe una pregunta de interrogatorio, construye el prompt y consulta Bedrock
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              # Un perfil de inferencia enruta la invocación a la región con
              # capacidad libre, así que el permiso necesita el propio perfil y
              # el modelo base en las tres regiones que abarca.
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"
                - !Sub "arn:aws:bedrock:us-east-1::foundation-model/${BedrockFoundationModelId}"
                - !Sub "arn:aws:bedrock:us-east-2::foundation-model/${BedrockFoundationModelId}"
                - !Sub "arn:aws:bedrock:us-west-2::foundation-model/${BedrockFoundationModelId}"
      Events:
        PostInterrogate:
          Type: Api
          Properties:
            Path: /interrogate
            Method: post
        OptionsInterrogate:
          Type: Api
          Properties:
            Path: /interrogate
            Method: options

Outputs:
  InterrogateApi:
    Description: URL del endpoint POST /interrogate
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/interrogate"
